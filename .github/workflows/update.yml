name: Update AltStore source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/update_source.py"

permissions:
  contents: write

concurrency:
  group: update-altstore-source
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = "https://api.github.com/repos/itzzace/ytkace/releases/latest"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "Alunatix/ytkace-altstore-source",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          state_path = Path(".state.json")
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          force = os.environ["EVENT_NAME"] in {"push", "workflow_dispatch"}
          changed = str(state.get("releaseId")) != str(release["id"])
          update = force or changed

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"update={'true' if update else 'false'}", file=output)
              print(f"tag={release['tag_name']}", file=output)

          print(
              f"latest={release['tag_name']} release_id={release['id']} "
              f"stored={state.get('releaseId')} force={force} update={update}"
          )
          PY

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate source from official IPA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_source.py

      - name: Validate JSON
        run: |
          python3 -m json.tool source.json >/dev/null
          python3 -m json.tool .state.json >/dev/null

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source.json .state.json
          if git diff --cached --quiet; then
            echo "Source is already current."
          else
            git commit -m "Update YTKACE source to ${{ needs.check.outputs.tag }}"
            git push
          fi
